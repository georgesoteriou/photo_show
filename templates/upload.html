<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Photoshow</title>
	<!-- Embedded SVG Favicon -->
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23764ba2'%3E%3Cpath d='M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5 5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3z'/%3E%3C/svg%3E">
	<style>
		body { 
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
			text-align: center; 
			padding: 2rem 1rem; 
			margin: 0;
			background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
			color: white; 
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.container { 
			width: 100%;
			max-width: 400px; 
			background: rgba(255, 255, 255, 0.1); 
			backdrop-filter: blur(12px);
			-webkit-backdrop-filter: blur(12px);
			padding: 3rem 2rem; 
			border-radius: 24px; 
			box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
			border: 1px solid rgba(255, 255, 255, 0.2);
		}
		h1 { margin-top: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
		p { color: rgba(255, 255, 255, 0.8); margin-bottom: 2rem; line-height: 1.5; }
		
		/* Hide the actual file input */
		input[type="file"] { display: none; }
		
		/* Style the label as a massive button */
		.upload-btn { 
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: white; 
			color: #764ba2; 
			padding: 2rem; 
			border-radius: 16px; 
			cursor: pointer; 
			font-size: 1.2rem; 
			font-weight: bold;
			transition: transform 0.2s, box-shadow 0.2s;
			box-shadow: 0 4px 15px rgba(0,0,0,0.2);
		}
		.upload-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }
		.upload-btn:active { transform: translateY(0); }
		.upload-btn svg { width: 48px; height: 48px; margin-bottom: 1rem; fill: currentColor; }
		
		.success { 
			background: rgba(46, 204, 113, 0.2); 
			color: #a8ffc9; 
			padding: 1rem;
			border-radius: 12px;
			margin-bottom: 1.5rem; 
			display: none; 
			border: 1px solid rgba(46, 204, 113, 0.4);
			font-weight: 500;
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="success" id="msg">Your photo was sent to the big screen!</div>
		<h1>Photoshow</h1>
		<p>Snap a picture and share it with the event instantly.</p>
		
		<form id="upload-form" action="/upload" method="POST" enctype="multipart/form-data">
			<label class="upload-btn">
				<svg viewBox="0 0 24 24">
					<path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2m8 3a5 5 0 0 0-5 5 5 5 0 0 0 5 5 5 5 0 0 0 5-5 5 5 0 0 0-5-5m0 2a3 3 0 0 1 3 3 3 3 0 0 1-3 3 3 3 0 0 1-3-3 3 3 0 0 1 3-3z"/>
				</svg>
				Choose Photo
				<input type="file" name="image" accept="image/*" id="file-input" required>
			</label>
		</form>
	</div>
	<script>
		// Show success message if redirected
		if(window.location.search.includes('success=1')) {
			document.getElementById('msg').style.display = 'block';
			// Clean up URL
			window.history.replaceState({}, document.title, "/");
		}

		// Auto-submit the form as soon as a file is selected
		document.getElementById('file-input').addEventListener('change', function() {
			if(this.files.length > 0) {
				document.body.style.opacity = '0.5'; // Visual feedback that it's loading
				document.getElementById('upload-form').submit();
			}
		});
	</script>
</body>
</html>
