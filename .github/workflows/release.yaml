name: Build and Release Binaries

on:
  push:
    branches:
      - master

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries
        run: |
          echo "Building for Windows..."
          GOOS=windows GOARCH=amd64 go build -o photoshow-windows-amd64.exe main.go
          GOOS=windows GOARCH=arm64 go build -o photoshow-windows-arm64.exe main.go
          
          echo "Building for macOS..."
          GOOS=darwin GOARCH=amd64 go build -o photoshow-mac-intel main.go
          GOOS=darwin GOARCH=arm64 go build -o photoshow-mac-arm64 main.go
          
          echo "Building for Linux..."
          GOOS=linux GOARCH=amd64 go build -o photoshow-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 go build -o photoshow-linux-arm64 main.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
             type=raw,value=latest
             type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Short Commit Hash for Tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ steps.vars.outputs.sha_short }}"
          name: "Build ${{ steps.vars.outputs.sha_short }}"
          body: "Automated build for commit ${{ steps.vars.outputs.sha_short }}"
          files: |
            photoshow-*